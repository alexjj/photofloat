<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="medium" content="image" />
	<meta name="theme-color" content="#222222" />
	<title>Photos</title>
	<link href="css/photofloat.css?v=3" rel="stylesheet" />
	<script src="js/photofloat.js?v=3" defer></script>
	<script src="js/display.js?v=3" defer></script>
</head>
<body>
<div id="title">Photos</div>
<div id="photo-view">
	<div id="photo-box">
		<a id="next-photo"><img id="photo" alt="" /></a>
		<div id="photo-bar">
			<div id="photo-links">
				<a id="metadata-link" href="javascript:void(0)">show metadata</a><span id="original-divider"> | </span><a id="original-link" target="_blank" rel="noopener">download original</a><span id="fullscreen-divider"> | </span><a id="fullscreen" href="javascript:void(0)">fullscreen</a>
			</div>
			<div id="metadata"></div>
		</div>
	</div>
	<div id="video-box">
		<div id="video-box-inner">
		</div>
	</div>

	<a id="back">&lsaquo;</a>
	<a id="next">&rsaquo;</a>
</div>
<div id="album-view">
	<div id="thumbs">
		<div id="loading">Loading...</div>
	</div>
	<div id="subalbums"></div>
</div>

<div id="error-overlay"></div>
<div id="error-text">Forgot my camera.</div>
<div id="auth-text"><form id="auth-form"><input id="password" type="password" autocomplete="current-password" /><input type="submit" value="Login" /></form></div>

</body>
</html>
